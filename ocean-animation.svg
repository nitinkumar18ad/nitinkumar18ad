<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <style>
      .wave1 { animation: wave1 4s ease-in-out infinite; }
      .wave2 { animation: wave2 4s ease-in-out infinite; }
      .fish1 { animation: swim1 8s linear infinite; }
      .fish2 { animation: swim2 12s linear infinite; }
      .fish3 { animation: swim3 10s linear infinite; }
      .bubble { animation: rise 3s ease-in infinite; }
      @keyframes wave1 {
        0%, 100% { d: path("M0,80 C150,40 300,120 450,80 C600,40 750,120 900,80 L900,200 L0,200 Z"); }
        50% { d: path("M0,100 C150,60 300,140 450,100 C600,60 750,140 900,100 L900,200 L0,200 Z"); }
      }
      @keyframes wave2 {
        0%, 100% { d: path("M0,110 C150,70 300,150 450,110 C600,70 750,150 900,110 L900,200 L0,200 Z"); }
        50% { d: path("M0,90 C150,130 300,50 450,90 C600,130 750,50 900,90 L900,200 L0,200 Z"); }
      }
      @keyframes swim1 {
        0% { transform: translateX(-60px); }
        100% { transform: translateX(960px); }
      }
      @keyframes swim2 {
        0% { transform: translateX(-60px) scaleX(-1); }
        100% { transform: translateX(960px) scaleX(-1); }
      }
      @keyframes swim3 {
        0% { transform: translateX(960px) scaleX(-1); }
        100% { transform: translateX(-60px) scaleX(-1); }
      }
      @keyframes rise {
        0% { opacity: 0.8; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-40px); }
      }
    </style>
    <linearGradient id="oceanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0d2137"/>
    </linearGradient>
    <linearGradient id="waveGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e6fa8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d2137" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#155e8a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0a1a2e" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#oceanGrad)"/>

  <!-- Stars/bubbles in background -->
  <circle cx="100" cy="30" r="1" fill="white" opacity="0.4"/>
  <circle cx="200" cy="15" r="1.5" fill="white" opacity="0.3"/>
  <circle cx="350" cy="25" r="1" fill="white" opacity="0.5"/>
  <circle cx="500" cy="10" r="1" fill="white" opacity="0.3"/>
  <circle cx="650" cy="30" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="800" cy="20" r="1" fill="white" opacity="0.3"/>

  <!-- Text -->
  <text x="450" y="55" font-family="monospace" font-size="16" fill="#60a5fa" text-anchor="middle" opacity="0.9" font-weight="bold">~ nitinkumar18ad&#39;s contributions ~</text>

  <!-- Wave 2 (back) -->
  <path class="wave2" d="M0,110 C150,70 300,150 450,110 C600,70 750,150 900,110 L900,200 L0,200 Z" fill="url(#waveGrad2)"/>

  <!-- Wave 1 (front) -->
  <path class="wave1" d="M0,80 C150,40 300,120 450,80 C600,40 750,120 900,80 L900,200 L0,200 Z" fill="url(#waveGrad1)"/>

  <!-- Fish 1 (orange, swims right) -->
  <g class="fish1" style="transform: translateX(-60px)">
    <g transform="translate(0, 110)">
      <ellipse cx="0" cy="0" rx="14" ry="7" fill="#f97316"/>
      <polygon points="-14,0 -22,-7 -22,7" fill="#ea580c"/>
      <circle cx="8" cy="-2" r="2" fill="white"/>
      <circle cx="8.5" cy="-2" r="1" fill="#0d1117"/>
    </g>
  </g>

  <!-- Fish 2 (teal, swims right, deeper) -->
  <g class="fish2" style="transform: translateX(-60px) scaleX(-1)">
    <g transform="translate(0, 140)">
      <ellipse cx="0" cy="0" rx="11" ry="5.5" fill="#14b8a6"/>
      <polygon points="-11,0 -18,-5 -18,5" fill="#0d9488"/>
      <circle cx="6" cy="-1.5" r="1.5" fill="white"/>
      <circle cx="6.5" cy="-1.5" r="0.8" fill="#0d1117"/>
    </g>
  </g>

  <!-- Fish 3 (purple, swims left) -->
  <g class="fish3" style="transform: translateX(960px) scaleX(-1)">
    <g transform="translate(0, 125)">
      <ellipse cx="0" cy="0" rx="12" ry="6" fill="#a855f7"/>
      <polygon points="-12,0 -20,-6 -20,6" fill="#9333ea"/>
      <circle cx="7" cy="-1.5" r="1.8" fill="white"/>
      <circle cx="7.5" cy="-1.5" r="0.9" fill="#0d1117"/>
    </g>
  </g>

  <!-- Bubbles -->
  <circle class="bubble" cx="120" cy="170" r="3" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.6" style="animation-delay: 0s"/>
  <circle class="bubble" cx="300" cy="180" r="2" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.5" style="animation-delay: 1s"/>
  <circle class="bubble" cx="500" cy="175" r="2.5" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.6" style="animation-delay: 2s"/>
  <circle class="bubble" cx="700" cy="170" r="2" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.5" style="animation-delay: 0.5s"/>
  <circle class="bubble" cx="850" cy="178" r="3" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.6" style="animation-delay: 1.5s"/>
</svg>